# Umami Analytics - отдельный поддомен
# Файл: /etc/nginx/sites-enabled/analytics.tgdistill.space

server {
    listen 80;
    listen [::]:80;
    server_name analytics.tgdistill.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name analytics.tgdistill.space;

    ssl_certificate /etc/letsencrypt/live/analytics.tgdistill.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.tgdistill.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
